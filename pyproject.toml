[project]
name = "termcall"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.0",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "supabase>=2.10.0",
    "aiortc>=1.9.0",
    "av>=13.0.0",
    "sounddevice>=0.5.0",
    "keyring>=25.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires a local Supabase instance (supabase start)",
]
